<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Recorder · API 录制器</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">🍶 API Recorder</div>

    <label class="field">
      <span>内核</span>
      <select id="mode">
        <option value="builtin">自带 Chromium</option>
        <option value="local">本机浏览器</option>
      </select>
    </label>

    <label class="field hide" id="localBrowserField">
      <span>浏览器</span>
      <select id="localBrowser">
        <option value="auto">自动探测</option>
        <option value="chrome">Chrome</option>
        <option value="edge">Edge</option>
      </select>
    </label>

    <input id="localPath" class="input hide" placeholder="本机 Chrome/Edge 路径（可选，留空则按上面选择）" />

    <label class="field">
      <span>起始 URL</span>
      <input id="startUrl" class="input" placeholder="about:blank" />
    </label>

    <button id="startBtn" class="btn btn-primary">● 开始录制</button>
    <button id="stopBtn" class="btn" disabled>■ 停止</button>
    <button id="clearBtn" class="btn">清空</button>
    <button id="exportBtn" class="btn btn-primary">📤 导出</button>
    <button id="maskSettingsBtn" class="btn-mini" title="配置（Mock 服务 / 端口）">⚙</button>
    <div id="maskPanel" class="mask-panel hide">
      <div class="mask-title">配置</div>

      <div class="mask-section">
        <div class="mask-subtitle">Mock 服务（点按钮直接起，无需导出脚本）</div>
        <span id="mockStatus" class="status status-idle">Mock 未启动</span>
        <div class="mask-btn-row">
          <button id="startMock" class="btn btn-primary">▶ 启动 Mock 服务</button>
          <button id="stopMock" class="btn" disabled>■ 停止 Mock</button>
        </div>
      </div>

      <div class="mask-divider"></div>

      <div class="mask-section">
        <div class="mask-subtitle">服务端口（重启生效）</div>
        <label class="mask-row">端口 <input id="portInput" class="input" maxlength="6" placeholder="自动" /></label>
        <div class="mask-hint" id="portHint">端口为程序启动时绑定，修改后需重启本程序。留空 = 自动选择空闲端口。</div>
        <button id="maskSave" class="btn-mini">保存</button>
      </div>
    </div>
    <button id="importBtn" class="btn">导入</button>
    <input id="importFile" type="file" accept=".har,.json,application/json" class="hide" />

    <span id="status" class="status status-idle">空闲</span>
  </header>

  <section class="subbar">
    <input id="search" class="input grow" placeholder="搜索 URL / 域名 / 方法 …" />
    <select id="methodFilter" class="select">
      <option value="all">所有方法</option>
      <option value="GET">GET</option>
      <option value="POST">POST</option>
      <option value="PUT">PUT</option>
      <option value="DELETE">DELETE</option>
      <option value="PATCH">PATCH</option>
      <option value="HEAD">HEAD</option>
      <option value="OPTIONS">OPTIONS</option>
    </select>
    <select id="typeFilter" class="select">
      <option value="all">所有类型</option>
      <option value="XHR">XHR</option>
      <option value="FETCH">Fetch</option>
      <option value="DOCUMENT">Document</option>
      <option value="SCRIPT">Script</option>
      <option value="STYLESHEET">Stylesheet</option>
      <option value="IMAGE">Image</option>
      <option value="FONT">Font</option>
      <option value="MEDIA">Media</option>
      <option value="WEBSOCKET">WebSocket</option>
      <option value="OTHER">Other</option>
    </select>
    <label class="check"><input type="checkbox" id="onlyApi" /> 仅 API</label>
    <label class="check"><input type="checkbox" id="onlyError" /> 仅错误</label>
    <span id="stats" class="stats"></span>
  </section>

  <main class="main">
    <div id="tree" class="tree">
      <div class="empty">点击「开始录制」拉起浏览器，这里会按域名实时组织所有请求。</div>
    </div>
    <aside id="detail" class="detail">
      <div class="empty">选择左侧任意请求查看详情。</div>
    </aside>
  </main>

  <!-- 导出弹窗（含格式选择与脱敏配置） -->
  <div id="exportModal" class="modal-mask hide">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title">导出</span>
        <button id="exportModalClose" class="modal-close" title="关闭">×</button>
      </div>

      <div class="modal-section">
        <div class="modal-subtitle">导出格式</div>
        <div class="radio-row">
          <label class="radio"><input type="radio" name="exportFormat" value="har" checked /> HAR</label>
          <label class="radio"><input type="radio" name="exportFormat" value="json" /> JSON</label>
          <label class="radio"><input type="radio" name="exportFormat" value="mock" /> Mock 脚本</label>
        </div>
        <button id="doExportBtn" class="btn btn-primary">导出</button>
      </div>

      <div class="modal-divider"></div>

      <div class="modal-section">
        <div class="modal-subtitle">脱敏（导出时生效）</div>
        <label class="check"><input type="checkbox" id="desensitize" /> 脱敏导出</label>
        <div class="mask-row">中文 → <input id="maskCjk" class="input" maxlength="8" placeholder="测" /></div>
        <div class="mask-row">数字 → <input id="maskDigit" class="input" maxlength="8" placeholder="1" /></div>
        <div class="mask-row">英文 → <input id="maskAlpha" class="input" maxlength="8" placeholder="a" /></div>
        <div class="mask-hint">留空 = 不脱敏该类；可填多个字符。默认 测 / 1 / a。</div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
