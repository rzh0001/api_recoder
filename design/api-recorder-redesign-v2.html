<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>API Recorder · 改版原型 v3（减法版）</title>
<style>
  :root{
    --accent:#0d9488; --accent-d:#0f766e; --accent-l:#ccfbf1;
    --bg:#f6f8f9; --panel:#ffffff; --line:#e4e9ec; --line2:#eef2f4;
    --txt:#1f2a30; --muted:#7c8a93; --muted2:#9aa7af;
    --red:#e23b3b; --red-l:#fde8e8; --amber:#d99315; --green:#1f9d55;
    --shadow:0 1px 3px rgba(16,33,40,.06),0 4px 16px rgba(16,33,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft Yahei",sans-serif;color:var(--txt);background:var(--bg)}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .hide{display:none!important}
  .m{min-width:46px;text-align:center;font-size:10px;font-weight:700;padding:2px 0;border-radius:4px;color:#fff}
  .m.GET{background:#1f9d55}.m.POST{background:#0d9488}.m.PUT{background:#d99315}.m.DELETE{background:#e23b3b}.m.PATCH{background:#7c5cd6}

  /* ===== 顶栏：细状态条（录制/Mock/收件箱/菜单）===== */
  .topbar{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand-sm{font-weight:800;font-size:15px}
  .view-title{font-weight:700;font-size:13px;color:var(--muted)}
  .spacer{flex:1}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:12px;position:relative}
  .chip:hover{border-color:var(--accent)}
  .chip.rec.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.rec .dot{width:7px;height:7px;border-radius:50%;background:#c2ccd1}
  .chip.rec.on .dot{background:#fff;animation:pulse 1.1s infinite}
  @keyframes pulse{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}
  .chip.mock.on{background:#eafaf4;border-color:#bde9da;color:var(--accent-d)}
  .chip.inbox{background:var(--red-l);border-color:#f6cccc;color:var(--red)}
  .chip.menu{font-size:16px;padding:4px 12px}
  .pop{position:absolute;top:42px;right:0;width:280px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px;z-index:60;display:none}
  .pop.show{display:block}
  .pop h4{margin:0 0 8px;font-size:12px;color:var(--muted)}
  .pop .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .pop .row label{font-size:11px;color:var(--muted);width:48px;flex:none}
  .pop input[type=text],.pop input[type=number],.pop select{flex:1;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;min-width:0}
  .pop .acts{display:flex;gap:6px;margin-top:4px}
  .pop .link{color:var(--accent-d);font-size:11px;cursor:pointer;margin-top:6px;display:inline-block}
  .menu-pop{width:180px}
  .menu-pop .mi{padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600}
  .menu-pop .mi:hover{background:var(--line2)}

  /* ===== 主体：左列表 + 中工作台 ===== */
  .body{flex:1;display:flex;min-height:0}
  .sidebar{width:288px;min-width:288px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .side-head{padding:12px 14px 8px;border-bottom:1px solid var(--line2)}
  .side-head input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;outline:none}
  .side-head input:focus{border-color:var(--accent)}
  .inbox-mini{margin-top:8px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--red-l);color:var(--red);font-weight:600;cursor:pointer;font-size:12px}
  .inbox-mini.empty{background:var(--line2);color:var(--muted)}
  .inbox-mini .b{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:11px}
  .inbox-mini.empty .b{background:var(--muted2)}
  .ep-list{flex:1;overflow:auto;padding:6px 8px 12px}
  .group-label{padding:10px 8px 4px;font-size:11px;color:var(--muted);font-weight:700}
  .ep{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .ep:hover{background:var(--line2)} .ep.active{background:var(--accent-l)}
  .ep .path{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ep .meta{display:flex;gap:5px;align-items:center;font-size:10px;color:var(--muted)}
  .pip{width:7px;height:7px;border-radius:50%;background:#cbd5da}.pip.on{background:var(--accent)}
  .cnt{background:var(--line2);border-radius:8px;padding:0 6px;color:var(--muted)}
  .cnt.miss{background:var(--red-l);color:var(--red)}

  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .ep-top{padding:11px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .ep-top .method{font-size:11px;font-weight:700;color:#fff;padding:3px 8px;border-radius:5px;margin-right:6px}
  .ep-top .p{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .ep-top .name{color:var(--muted);font-size:12px;margin-left:6px}
  .tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line)}
  .tab{padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
  .tab.active{color:var(--accent-d);border-bottom-color:var(--accent)}
  .tab .nb{background:var(--line2);border-radius:8px;padding:0 6px;font-size:10px;margin-left:4px;color:var(--muted)}
  .tab .nb.miss{background:var(--red-l);color:var(--red)}
  .work{flex:1;overflow:auto;padding:16px 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:12px}
  .card-h{padding:10px 14px;border-bottom:1px solid var(--line2);font-weight:700;display:flex;align-items:center;gap:8px}
  .smpl{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
  .smpl:hover{background:var(--line2)} .smpl:last-child{border-bottom:0}
  .smpl .st{font-size:11px;font-weight:700;padding:1px 8px;border-radius:5px;color:#fff}
  .st.s2{background:var(--green)}.st.s4{background:var(--red)}.st.s3{background:var(--amber)}.st.s5{background:#7c5cd6}
  .smpl .t{color:var(--muted);font-size:11px}.smpl .sz{margin-left:auto;color:var(--muted2);font-size:11px}
  .field-table{width:100%;border-collapse:collapse}
  .field-table th,.field-table td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line2);font-size:12px}
  .field-table th{color:var(--muted);font-weight:700;background:var(--line2)}
  .field-table .type{color:var(--accent-d);font-family:ui-monospace,monospace}
  .field-table .req{color:var(--red);font-size:11px}
  .doc-edit{display:flex;flex-direction:column;gap:10px;padding:14px}
  .doc-edit label{font-weight:600;color:var(--muted);font-size:12px}
  .doc-edit input,.doc-edit textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;outline:none}
  .doc-edit input:focus,.doc-edit textarea:focus{border-color:var(--accent)}
  .mock-row{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .mock-row .body-prev{flex:1;font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{padding:7px 13px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--txt)}
  .btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--accent-d)} .btn.sm{padding:4px 10px;font-size:11px}
  .tag{background:var(--accent-l);color:var(--accent-d);border-radius:6px;padding:1px 8px;font-size:11px}
  .pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.mock-on{background:#d7f5ec;color:var(--accent-d)} .pill.mock-off{background:var(--line2);color:var(--muted)}
  .empty{padding:40px;text-align:center;color:var(--muted2)}
  .stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
  .stat .v{font-size:22px;font-weight:800}.stat .k{color:var(--muted);font-size:12px;margin-top:2px}
  .bar{display:flex;align-items:center;gap:8px;padding:6px 0}
  .bar .nm{width:120px;color:var(--muted);font-size:12px}
  .bar .track{flex:1;height:8px;background:var(--line2);border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)} .bar .n{width:40px;text-align:right;font-size:11px;color:var(--muted)}
  .log{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
  .log:hover{background:var(--line2)}
  .log .ok{font-size:11px;font-weight:700;padding:1px 8px;border-radius:5px}
  .log .ok.hit{background:#d7f5ec;color:var(--accent-d)} .log .ok.miss{background:var(--red-l);color:var(--red)}
  .log .mp{font-family:ui-monospace,monospace;font-size:12px}.log .rs{color:var(--muted);font-size:11px;margin-left:auto}

  /* ===== 浮层 / 抽屉 ===== */
  .mask{position:fixed;inset:0;background:rgba(16,33,40,.32);display:none;z-index:40}
  .mask.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:420px;background:var(--panel);box-shadow:-8px 0 30px rgba(16,33,40,.18);transform:translateX(100%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .drawer-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center}
  .drawer-h .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px}
  .drawer-b{flex:1;overflow:auto;padding:14px 16px}
  .drawer-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .miss-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:9px}
  .miss-item .info{flex:1;min-width:0}.miss-item .mp{font-family:ui-monospace,monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .miss-item .reason{font-size:11px;color:var(--muted)}
  .form-row{margin-bottom:13px}.form-row label{display:block;font-weight:600;color:var(--muted);margin-bottom:5px;font-size:12px}
  .form-row input,.form-row textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;outline:none}
  .form-row input:focus,.form-row textarea:focus{border-color:var(--accent)}
  .form-row textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
  .pre{background:var(--line2);border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);white-space:pre-wrap;word-break:break-all}
  .note{background:#fff8ec;border:1px solid #f3e2bd;color:#8a6512;border-radius:8px;padding:9px 11px;font-size:11px}
  .exp-opt{display:flex;gap:10px;padding:9px 14px;align-items:center}.exp-opt .rd{flex:1}
  .set-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line2)}
  .set-row label{width:120px;font-weight:600;color:var(--muted)}
  .set-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;max-width:240px}
  .proto-tag{position:fixed;bottom:10px;right:14px;color:var(--muted2);font-size:11px;z-index:60}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-sm">🍶</div>
    <div class="view-title" id="viewTitle">接口台账</div>
    <div class="spacer"></div>
    <div class="chip rec on" id="recChip"><span class="dot"></span> 录制中</div>
    <div class="chip mock" id="mockChip">🧪 :7890</div>
    <div class="chip inbox" id="inboxChip">📥 <span id="inboxN">2</span></div>
    <div class="chip menu" id="menuChip">⋯</div>

    <div class="pop" id="recPop">
      <h4>实时录制</h4>
      <div class="row"><label>内核</label><select id="recKernel"><option>自带 Chromium</option><option>本机浏览器</option></select></div>
      <div class="row"><label>起始URL</label><input type="text" id="recUrl" placeholder="about:blank" /></div>
      <div class="acts"><button class="btn sm primary" id="recToggle">停止录制</button></div>
    </div>
    <div class="pop" id="mockPop">
      <h4>Mock 服务</h4>
      <div class="row"><label>端口</label><input type="text" id="mockPort" value="7890" /></div>
      <div class="row"><label>严格</label><input type="checkbox" id="mockStrict" checked /> <span style="font-size:11px;color:var(--muted)">开：未命中 404</span></div>
      <div class="acts"><button class="btn sm primary" id="mockToggle">停止</button></div>
      <span class="link" id="mockLogsLink">查看处理记录 →</span>
    </div>
    <div class="pop menu-pop" id="menuPop">
      <div class="mi" data-act="overview">🏠 概览</div>
      <div class="mi" data-act="export">📤 导出</div>
      <div class="mi" data-act="settings">⚙ 设置</div>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <div class="side-head">
        <input id="listSearch" placeholder="搜索接口 / 域名 / 标签…" />
        <div class="inbox-mini" id="inboxMini"><span>📥 待造数据</span><span class="b" id="inboxMiniN">2</span></div>
      </div>
      <div class="ep-list" id="epList"></div>
    </aside>

    <main class="main">
      <div id="dash"><div class="work" id="dashWork"></div></div>
      <div id="epCtx" class="hide">
        <div class="ep-top">
          <span class="method" id="epMethod">GET</span><span class="p" id="epPath">/api/...</span>
          <span class="name" id="epName"></span>
          <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
            <button class="btn sm ghost" id="epExportBtn">📤 导出此接口</button>
            <span class="tag" id="epTag">登录</span>
            <span class="pill mock-on" id="epPill">Mock 已固定</span>
          </div>
        </div>
        <div class="tabs" id="tabs">
          <div class="tab active" data-tab="samples">样本 <span class="nb" id="nbSamples">0</span></div>
          <div class="tab" data-tab="fields">字段</div>
          <div class="tab" data-tab="doc">文档</div>
          <div class="tab" data-tab="mock">Mock</div>
        </div>
        <div class="work" id="work"></div>
      </div>
    </main>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="drawer" id="inboxDrawer"><div class="drawer-h">📥 待造数据（Mock 未命中）<span class="x" data-close>×</span></div><div class="drawer-b" id="inboxBody"></div></div>
<div class="drawer" id="makeDrawer">
  <div class="drawer-h">🛠 造一条 Mock 数据 <span class="x" data-close>×</span></div>
  <div class="drawer-b">
    <div class="note">来自一次真实未命中请求，method/path/query 已预填。填状态码和响应体，保存即成为该接口的固定返回。</div>
    <div class="form-row"><label>请求方法</label><input id="mkMethod" readonly /></div>
    <div class="form-row"><label>路径 Path</label><input id="mkPath" readonly /></div>
    <div class="form-row"><label>Query（来自未命中请求）</label><input id="mkQuery" readonly /></div>
    <div class="form-row"><label>状态码</label><input id="mkStatus" value="200" /></div>
    <div class="form-row"><label>响应体（JSON / 文本）</label><textarea id="mkBody">{
  "code": 0,
  "message": "ok",
  "data": {}
}</textarea></div>
    <div class="form-row"><label>预览</label><div class="pre" id="mkPreview"></div></div>
  </div>
  <div class="drawer-f"><button class="btn" data-close>取消</button><button class="btn primary" id="mkSave">保存为固定 Mock</button></div>
</div>
<div class="drawer" id="logsDrawer"><div class="drawer-h">📜 处理记录（Mock 实时流水）<span class="x" data-close>×</span></div><div class="drawer-b" id="logsBody"></div></div>
<div class="drawer" id="exportDrawer"><div class="drawer-h">📤 导出<span class="x" data-close>×</span></div><div class="drawer-b" id="exportBody"></div></div>
<div class="drawer" id="settingsDrawer"><div class="drawer-h">⚙ 设置（通用）<span class="x" data-close>×</span></div><div class="drawer-b" id="settingsBody"></div></div>
<div class="proto-tag">原型 v3 · 减法版 · 顶栏状态 + 列表 + 工作台，其余皆浮层</div>

<script>
const endpoints = [
  { method:"POST", path:"/api/user/login", name:"用户登录", tag:"登录", domain:"api",
    mock:true, samples:[
      {seq:1,status:200,statusText:"OK",time:"09:12:03",size:"1.2KB",body:'{"code":0,"message":"ok","data":{"token":"eyJ…","userId":1024}}'},
      {seq:7,status:200,statusText:"OK",time:"09:31:55",size:"1.2KB",body:'{"code":0,"message":"ok","data":{"token":"eyJ…","userId":1024}}'},
    ],
    fields:[{name:"username",type:"string",req:"必填",note:"登录账号"},{name:"password",type:"string",req:"必填",note:"明文上行"},{name:"captcha",type:"string",req:"可选",note:"图形验证码"}],
    respFields:[{name:"code",type:"int",req:"—",note:"0=成功"},{name:"data.token",type:"string",req:"—",note:"令牌"},{name:"data.userId",type:"int",req:"—",note:""}],
    mockBody:'{"code":0,"message":"ok","data":{"token":"eyJ…","userId":1024}}', mockHits:38 },
  { method:"GET", path:"/api/user/info", name:"用户信息", tag:"用户", domain:"api",
    mock:false, samples:[{seq:3,status:200,statusText:"OK",time:"09:13:20",size:"2.0KB",body:'{"code":0,"data":{"nick":"张三","dept":"技术科"}}'}],
    fields:[{name:"id",type:"int",req:"必填",note:"用户ID"}], respFields:[{name:"nick",type:"string",req:"—",note:""},{name:"dept",type:"string",req:"—",note:""}],
    mockBody:"", mockHits:0 },
  { method:"POST", path:"/api/order/create", name:"创建订单", tag:"订单", domain:"api",
    mock:false, samples:[{seq:5,status:201,statusText:"Created",time:"09:20:11",size:"0.9KB",body:'{"code":0,"data":{"orderId":"O2026…"}}'}],
    fields:[{name:"sku",type:"string",req:"必填",note:""},{name:"qty",type:"int",req:"必填",note:"数量"}], respFields:[{name:"orderId",type:"string",req:"—",note:""}],
    mockBody:"", mockHits:0 },
  { method:"GET", path:"/api/notice/list", name:"通知列表", tag:"通知", domain:"api",
    mock:true, samples:[], fields:[], respFields:[], mockBody:'{"code":0,"data":[{"id":1,"title":"系统升级"}]}', mockHits:12 },
];
const misses = [
  { method:"GET", path:"/api/banner/home", query:"pos=top&t=1726", reason:"严格模式：库内无此接口" },
  { method:"POST", path:"/api/cart/add", query:"", reason:"严格模式：method+path 无匹配记录" },
];
const logs = [
  {t:"09:41:02",method:"GET",path:"/api/banner/home",q:"pos=top",hit:false,status:404,reason:"库内无此接口"},
  {t:"09:40:58",method:"POST",path:"/api/cart/add",q:"",hit:false,status:404,reason:"method+path 无匹配"},
  {t:"09:40:30",method:"POST",path:"/api/user/login",q:"",hit:true,status:200,body:'{"code":0,"message":"ok","data":{"token":"eyJ…"}}'},
  {t:"09:40:11",method:"GET",path:"/api/notice/list",q:"",hit:true,status:200,body:'{"code":0,"data":[{"id":1}]}'},
  {t:"09:39:50",method:"GET",path:"/api/user/info",q:"id=1024",hit:true,status:200,body:'{"code":0,"data":{"nick":"张三"}}'},
];
let cur = null;
let curTab = "samples";
const mock = { running:true, port:7890, strict:true, hits:68 };
const $ = s => document.querySelector(s);

function renderList(){
  const q=$("#listSearch").value.trim().toLowerCase();
  const groups={};
  endpoints.filter(e=>!q||(e.path+" "+e.name+" "+e.tag).toLowerCase().includes(q)).forEach(e=>{(groups[e.domain]||=[]).push(e);});
  const el=$("#epList"); el.innerHTML="";
  Object.keys(groups).forEach(dom=>{
    const gl=document.createElement("div"); gl.className="group-label"; gl.textContent=dom+".example.com"; el.appendChild(gl);
    groups[dom].forEach(e=>{
      const missN=misses.filter(m=>m.path===e.path&&m.method===e.method).length;
      const row=document.createElement("div"); row.className="ep"+(e===cur?" active":"");
      row.innerHTML=`<span class="m ${e.method}">${e.method}</span><span class="path">${e.path}</span>
        <span class="meta"><span class="cnt">${e.samples.length}</span><span class="pip ${e.mock?"on":""}"></span>${missN?`<span class="cnt miss">${missN}</span>`:""}</span>`;
      row.onclick=()=>{ cur=e; curTab="samples"; showEndpoint(); };
      el.appendChild(row);
    });
  });
}
function renderHead(){
  $("#epMethod").textContent=cur.method; $("#epMethod").className="method m "+cur.method;
  $("#epPath").textContent=cur.path; $("#epName").textContent=cur.name?"· "+cur.name:"";
  $("#epTag").textContent=cur.tag||"未分类";
  $("#epPill").textContent=cur.mock?"Mock 已固定":"Mock 未固定"; $("#epPill").className="pill "+(cur.mock?"mock-on":"mock-off");
  $("#nbSamples").textContent=cur.samples.length;
}
function fieldTable(rows){ if(!rows.length) return `<div class="empty" style="padding:20px">无字段</div>`;
  return `<table class="field-table"><thead><tr><th>字段</th><th>类型</th><th>约束</th><th>说明</th></tr></thead><tbody>`+
    rows.map(r=>`<tr><td>${r.name}</td><td class="type">${r.type}</td><td>${r.req?'<span class="req">'+r.req+'</span>':"—"}</td><td>${r.note||""}</td></tr>`).join("")+`</tbody></table>`; }
function esc(s){return (s||"").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderWork(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===curTab));
  const w=$("#work");
  if(curTab==="samples"){
    if(!cur.samples.length){ w.innerHTML=`<div class="empty">该接口暂无抓包样本。<br>去「📥 待造数据」为它造一条 Mock，或开启实时录制后触发该接口。</div>`; return; }
    w.innerHTML=`<div class="card"><div class="card-h">📡 抓包样本（${cur.samples.length}）</div>`+
      cur.samples.map(s=>`<div class="smpl" onclick="alert('原型演示：展开样本 #${s.seq} 的请求/响应详情')"><span class="st s${s.status[0]}">${s.status}</span><span>#${s.seq}</span><span class="t">${s.time}</span><span class="sz">${s.size}</span></div>`).join("")+`</div>`;
  } else if(curTab==="fields"){
    w.innerHTML=`<div class="card"><div class="card-h">⬆ 请求字段（自动推断）</div>${fieldTable(cur.fields)}</div>
      <div class="card"><div class="card-h">⬇ 响应字段（自动推断）</div>${fieldTable(cur.respFields)}</div>`;
  } else if(curTab==="doc"){
    w.innerHTML=`<div class="card"><div class="doc-edit">
      <label>接口名称</label><input value="${cur.name||""}" onchange="cur.name=this.value;renderHead()">
      <label>标签</label><input value="${cur.tag||""}" onchange="cur.tag=this.value;renderHead();renderList()">
      <label>备注</label><textarea>用于 OA 单点登录后的令牌获取。</textarea>
      <div class="note">名称/标签/备注以 method+path 为键统一存储，样本/字段/Mock/台账全同步。</div></div></div>`;
  } else if(curTab==="mock"){
    const missN=misses.filter(m=>m.path===cur.path&&m.method===cur.method).length;
    const epLogs=logs.filter(l=>l.path===cur.path&&l.method===cur.method);
    const svcNote=mock.running?(cur.mock?`<div class="note" style="margin:0 14px 12px;background:#eafaf4;border-color:#bde9da;color:var(--accent-d)">Mock 服务运行中，固定返回对 127.0.0.1:${mock.port} 生效。</div>`
      :`<div class="note" style="margin:0 14px 12px">Mock 服务运行中，但该接口未固定返回——未命中走 404（去「📥 待造数据」补齐）。</div>`)
      :`<div class="note" style="margin:0 14px 12px">⚠️ Mock 服务未启动，固定返回暂不生效。点顶栏 🧪 启动。</div>`;
    let html=`<div class="card"><div class="card-h">🧪 Mock 状态
      <span style="margin-left:auto">${cur.mock?`<span class="pill mock-on">已固定返回</span>`:`<span class="pill mock-off">未固定</span>`}</span></div>
      ${svcNote}
      <div class="mock-row"><span class="m ${cur.method}">${cur.method}</span>
        <span class="body-prev">${cur.mock?esc(cur.mockBody):"（未固定任何返回）"}</span>
        <span class="cnt">累计命中 ${cur.mockHits}</span>
        <button class="btn sm primary" onclick="alert('原型演示：行内编辑固定响应体')">编辑响应</button></div>
      ${missN?`<div class="note" style="margin:0 14px 12px">该接口有 ${missN} 条未命中，去「📥 待造数据」一键补齐。</div>`:""}</div>`;
    if(epLogs.length) html+=`<div class="card"><div class="card-h">📈 该接口最近命中（${epLogs.length}）</div>`+
      epLogs.map(l=>`<div class="smpl" onclick="alert('原型演示：命中详情\\n${l.method} ${l.path}\\n${l.status} · ${l.t}')"><span class="st s${l.status[0]}">${l.status}</span><span class="t">${l.t}</span><span class="sz">命中</span></div>`).join("")+`</div>`;
    w.innerHTML=html;
  }
}
function showEndpoint(){ $("#dash").classList.add("hide"); $("#epCtx").classList.remove("hide"); $("#viewTitle").textContent=cur.path; renderList(); renderHead(); renderWork(); }
function showDash(){ cur=null; $("#epCtx").classList.add("hide"); $("#dash").classList.remove("hide"); $("#viewTitle").textContent="接口台账"; renderDash(); }
function renderDash(){
  const totalSamples=endpoints.reduce((a,e)=>a+e.samples.length,0);
  const mocked=endpoints.filter(e=>e.mock).length;
  const errs=endpoints.reduce((a,e)=>a+e.samples.filter(s=>s.status[0]==="4"||s.status[0]==="5").length,0);
  const rate=totalSamples?Math.round(errs/totalSamples*100):0;
  const doms={}; endpoints.forEach(e=>doms[e.domain]=(doms[e.domain]||0)+e.samples.length);
  const maxd=Math.max(1,...Object.values(doms));
  $("#dashWork").innerHTML=`<div class="stat-grid">
    <div class="stat"><div class="v">${endpoints.length}</div><div class="k">接口总数</div></div>
    <div class="stat"><div class="v">${totalSamples}</div><div class="k">抓包样本</div></div>
    <div class="stat"><div class="v">${mocked}</div><div class="k">Mock 已固定</div></div>
    <div class="stat"><div class="v" style="color:var(--red)">${misses.length}</div><div class="k">待造数据</div></div>
    <div class="stat"><div class="v">${rate}%</div><div class="k">错误率</div></div></div>
    <div class="card"><div class="card-h">📊 按域名分布</div>
    ${Object.keys(doms).map(d=>`<div class="bar"><span class="nm">${d}.example.com</span><span class="track"><span class="fill" style="width:${doms[d]/maxd*100}%"></span></span><span class="n">${doms[d]}</span></div>`).join("")}</div>
    <div class="card"><div class="card-h">🧭 怎么用</div>
    <div style="padding:6px 14px 12px;color:var(--muted)">选左侧任一接口 → 工作台看「样本 / 字段 / 文档 / Mock」。<br>
    顶栏 🧪 启停 Mock、⋯ 菜单进导出/设置、📥 一键补齐 404 未命中。</div></div>`;
}
function renderMockChip(){ const c=$("#mockChip"); c.classList.toggle("on",mock.running); c.textContent=(mock.running?"🧪 :"+mock.port:"🧪 未启动"); $("#mockToggle").textContent=mock.running?"停止":"启动"; }
function renderInbox(){
  const b=$("#inboxBody");
  if(!misses.length){ b.innerHTML=`<div class="empty">🎉 没有未命中的请求，Mock 全部覆盖。</div>`; return; }
  b.innerHTML=misses.map((m,i)=>`<div class="miss-item"><span class="m ${m.method}">${m.method}</span>
    <div class="info"><div class="mp">${m.path}${m.query?"?"+m.query:""}</div><div class="reason">${m.reason}</div></div>
    <button class="btn sm primary" onclick="openMake(${i})">造数据</button></div>`).join("");
  $("#inboxN").textContent=misses.length; $("#inboxMiniN").textContent=misses.length;
  const im=$("#inboxMini"); im.classList.toggle("empty",!misses.length);
}
function openMake(i){ const m=misses[i];
  $("#mkMethod").value=m.method; $("#mkPath").value=m.path; $("#mkQuery").value=m.query||"（无）";
  $("#mkStatus").value="200"; $("#mkBody").value='{\n  "code": 0,\n  "message": "ok",\n  "data": {}\n}'; updatePreview();
  closePops(); $("#inboxDrawer").classList.remove("show"); $("#makeDrawer").classList.add("show"); $("#mask").classList.add("show"); }
function updatePreview(){ $("#mkPreview").textContent=`HTTP/1.1 ${$("#mkStatus").value}\nContent-Type: application/json\n\n${$("#mkBody").value}`; }
$("#mkBody").oninput=updatePreview; $("#mkStatus").oninput=updatePreview;
$("#mkSave").onclick=()=>{ const m={method:$("#mkMethod").value,path:$("#mkPath").value};
  let ep=endpoints.find(e=>e.method===m.method&&e.path===m.path);
  if(!ep){ ep={method:m.method,path:m.path,name:"",tag:"未分类",domain:"api",mock:false,samples:[],fields:[],respFields:[],mockBody:"",mockHits:0}; endpoints.push(ep); }
  ep.mock=true; ep.mockBody=$("#mkBody").value; ep.mockHits=0;
  const idx=misses.findIndex(x=>x.method===m.method&&x.path===m.path); if(idx>=0) misses.splice(idx,1);
  $("#makeDrawer").classList.remove("show"); $("#mask").classList.remove("show");
  renderInbox(); renderList(); if(cur)renderHead(); $("#inboxMini").classList.toggle("empty",!misses.length);
  alert("已保存为固定 Mock ✓\n该接口台账 Mock 点已点亮，并从「待造数据」移除。"); };

function renderLogs(){ $("#logsBody").innerHTML=logs.map(l=>`<div class="log" onclick="alert('原型演示：处理记录详情\\n${l.method} ${l.path}\\n状态 ${l.status} · ${l.hit?"命中":"未命中"}${l.hit?"":"\\n原因："+l.reason}')">
  <span class="ok ${l.hit?"hit":"miss"}">${l.hit?"命中":"未命中"}</span><span class="m ${l.method}">${l.method}</span>
  <span class="mp">${l.path}${l.q?"?"+l.q:""}</span><span class="rs">${l.t} · ${l.status}</span></div>`).join("")+
  `<div class="note" style="margin:10px 14px">全局实时流水；进某接口「Mock」页签可见该接口自身的最近命中。</div>`; }
function renderExport(){ const scope=cur?`当前接口 ${cur.method} ${cur.path}`:"全部库";
  $("#exportBody").innerHTML=`<div class="exp-opt"><input type="radio" name="ex" ${cur?"":"checked"}><div class="rd"><b>导出全部库</b></div></div>
    ${cur?`<div class="exp-opt"><input type="radio" name="ex" checked><div class="rd"><b>仅当前接口</b><div style="color:var(--muted);font-size:11px">${cur.method} ${cur.path}</div></div></div>`:""}
    <div style="padding:6px 14px 0;color:var(--muted);font-size:11px">格式</div>
    <div class="exp-opt"><button class="btn primary">HAR</button><button class="btn primary">JSON</button><button class="btn primary">Mock 脚本</button><button class="btn primary">OpenAPI</button></div>
    <div style="padding:6px 14px 0;color:var(--muted);font-size:11px">脱敏（导出时生效）</div>
    <div class="exp-opt"><label class="check"><input type="checkbox"> 脱敏导出</label><span style="color:var(--muted);font-size:11px">中文→测 · 数字→1 · 英文→a（默认在设置）</span></div>
    <div class="exp-opt"><button class="btn">预览</button><button class="btn primary">导出到下载文件夹</button></div>
    <div class="note" style="margin:8px 14px 14px">后端直写 ~/Downloads。范围还支持按归属域 / 按标签 / 手动勾选。</div>`; }
function renderSettings(){ $("#settingsBody").innerHTML=`<div class="set-row"><label>服务端口</label><input value="6789"><span style="color:var(--muted);font-size:11px">主面板；改需重启</span></div>
  <div class="set-row"><label>Mock 端口</label><input value="7890"><span style="color:var(--muted);font-size:11px">持久化；一次性启停在顶栏 🧪</span></div>
  <div class="set-row"><label>脱敏·汉字</label><input value="测"></div>
  <div class="set-row"><label>脱敏·数字</label><input value="1"></div>
  <div class="set-row"><label>脱敏·字母</label><input value="a"></div>
  <div style="padding:12px 14px"><button class="btn primary" onclick="alert('原型演示：保存设置')">保存</button></div>
  <div class="note" style="margin:0 14px 14px">Mock 严格/模糊切换在顶栏 🧪 的气泡里，不在此页。本页只管端口与脱敏默认值两项通用配置。</div>`; }

function closePops(){ document.querySelectorAll(".pop").forEach(p=>p.classList.remove("show")); }
function togglePop(id){ const p=$("#"+id); const open=p.classList.contains("show"); closePops(); if(!open)p.classList.add("show"); }
$("#recChip").onclick=()=>togglePop("recPop");
$("#mockChip").onclick=()=>togglePop("mockPop");
$("#menuChip").onclick=()=>togglePop("menuPop");
$("#mockLogsLink").onclick=()=>{ closePops(); renderLogs(); $("#logsDrawer").classList.add("show"); $("#mask").classList.add("show"); };
document.querySelectorAll(".menu-pop .mi").forEach(mi=>mi.onclick=()=>{ closePops(); const a=mi.dataset.act;
  if(a==="overview")showDash(); else if(a==="export"){ renderExport(); $("#exportDrawer").classList.add("show"); $("#mask").classList.add("show"); }
  else { renderSettings(); $("#settingsDrawer").classList.add("show"); $("#mask").classList.add("show"); } });
$("#inboxChip").onclick=()=>{ renderInbox(); $("#inboxDrawer").classList.add("show"); $("#mask").classList.add("show"); };
$("#inboxMini").onclick=()=>{ renderInbox(); $("#inboxDrawer").classList.add("show"); $("#mask").classList.add("show"); };
$("#mask").onclick=()=>{ closePops(); document.querySelectorAll(".drawer").forEach(d=>d.classList.remove("show")); $("#mask").classList.remove("show"); };
document.querySelectorAll("[data-close]").forEach(x=>x.onclick=()=>{ document.querySelectorAll(".drawer").forEach(d=>d.classList.remove("show")); $("#mask").classList.remove("show"); });
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ curTab=t.dataset.tab; renderWork(); });
$("#epExportBtn").onclick=()=>{ renderExport(); $("#exportDrawer").classList.add("show"); $("#mask").classList.add("show"); };
$("#listSearch").oninput=renderList;
$("#recToggle").onclick=()=>{ const on=$("#recChip").classList.toggle("on"); $("#recChip").innerHTML=on?'<span class="dot"></span> 录制中':'<span class="dot"></span> 未录制'; $("#recToggle").textContent=on?"停止录制":"开始录制"; };
$("#mockToggle").onclick=()=>{ mock.running=!mock.running; if(mock.running)mock.port=parseInt($("#mockPort").value)||7890; renderMockChip(); if(cur)renderWork(); };

renderList(); renderDash(); renderMockChip(); renderInbox();
</script>
</body>
</html>
